name: Market data

on:
  schedule:
    # 22:30 UTC on weekdays, after the New York cash close and the Bangkok close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch prices and headlines
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npx tsx scripts/refresh-market.ts
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market/snapshot.json
          if git diff --staged --quiet; then
            echo "No market changes"
          else
            git commit -m "Update market snapshot"
            git push origin HEAD:main
          fi
      - run: npm test
      - name: Build the site with the new snapshot
        env:
          NEXT_PUBLIC_BASE_PATH: /invest-portfolio-assistant
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
